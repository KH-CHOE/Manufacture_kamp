<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description">
  <title id="title">Foundry Guard 시스템 구조</title>
  <desc id="description">CSV, Python 학습, 모델 pkl, SQLite, FastAPI, 웹 대시보드와 향후 챗봇 및 알림 채널의 흐름</desc>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#53666d"/></marker>
    <marker id="future-arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#d58a2d"/></marker>
    <style>
      .title{font:700 43px 'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#172126}.subtitle{font:400 20px 'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#60747a}.section{font:700 17px 'Apple SD Gothic Neo','Noto Sans KR',sans-serif;letter-spacing:2px;fill:#60747a}.node-title{font:700 23px 'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#172126}.node-body{font:400 17px 'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#52666d}.tool{font:700 15px 'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#fff}.arrow-label{font:500 15px 'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#60747a}.future{fill:#8a5b18}.legend{font:500 16px 'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#52666d}
    </style>
  </defs>
  <rect width="1920" height="1080" fill="#edf1f2"/>
  <rect x="0" y="0" width="1920" height="145" fill="#172126"/>
  <text x="92" y="76" class="title" fill="#fff">Foundry Guard · AI 품질 예방 관제</text>
  <text x="94" y="112" class="subtitle" fill="#c7d6d8">현재 구현 구조와 다음 확장 경로</text>
  <circle cx="1605" cy="75" r="8" fill="#74bdca"/><text x="1624" y="81" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="17" fill="#dce8e9">로컬 실행: FastAPI + Uvicorn</text>

  <text x="95" y="205" class="section">현재 구현</text>
  <line x1="95" y1="222" x2="1825" y2="222" stroke="#c8d4d6" stroke-width="2"/>

  <g transform="translate(95 270)">
    <rect width="270" height="170" fill="#fff" stroke="#b8c7c9" stroke-width="2"/>
    <rect width="270" height="37" fill="#31434c"/>
    <text x="16" y="25" class="tool">원본 데이터 · 파일 시스템</text>
    <text x="18" y="80" class="node-title">Input.csv</text>
    <text x="18" y="111" class="node-body">과거 생산 이벤트 73,611건</text>
    <text x="18" y="137" class="node-body">센서값 · PassOrFail</text>
  </g>
  <path d="M385 355 H485" stroke="#53666d" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="401" y="334" class="arrow-label">초기 적재</text>
  <g transform="translate(505 270)">
    <rect width="295" height="170" fill="#fff" stroke="#b8c7c9" stroke-width="2"/>
    <rect width="295" height="37" fill="#39795d"/>
    <text x="16" y="25" class="tool">Python · pandas · scikit-learn</text>
    <text x="18" y="80" class="node-title">train_model.py</text>
    <text x="18" y="111" class="node-body">Random Forest 학습</text>
    <text x="18" y="137" class="node-body">A/B/C 상·하한 산정</text>
  </g>
  <path d="M820 318 H900" stroke="#53666d" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M820 394 H900" stroke="#53666d" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(920 250)">
    <rect width="295" height="100" fill="#fff" stroke="#b8c7c9" stroke-width="2"/>
    <rect width="295" height="34" fill="#c7463a"/>
    <text x="15" y="23" class="tool">Python pickle</text>
    <text x="17" y="67" class="node-title">defect_model.pkl</text>
    <text x="17" y="89" class="node-body">모델 · 피처 · 관리선</text>
  </g>
  <g transform="translate(920 375)">
    <rect width="295" height="100" fill="#fff" stroke="#b8c7c9" stroke-width="2"/>
    <rect width="295" height="34" fill="#34586b"/>
    <text x="15" y="23" class="tool">SQLite</text>
    <text x="17" y="67" class="node-title">foundry_v2.db</text>
    <text x="17" y="89" class="node-body">이벤트 · 예측 이력</text>
  </g>
  <path d="M1235 300 H1325 V377 H1400" stroke="#53666d" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M1235 425 H1325 V377" stroke="#53666d" stroke-width="3" fill="none"/>
  <text x="1251" y="351" class="arrow-label">모델·DB 조회</text>
  <g transform="translate(1420 290)">
    <rect width="315" height="175" fill="#fff" stroke="#b8c7c9" stroke-width="2"/>
    <rect width="315" height="37" fill="#172126"/>
    <text x="16" y="25" class="tool">FastAPI · Uvicorn</text>
    <text x="18" y="81" class="node-title">app.py</text>
    <text x="18" y="112" class="node-body">GET /api/dashboard</text>
    <text x="18" y="138" class="node-body">POST /api/predict</text>
    <text x="18" y="164" class="node-body">정적 프론트엔드 제공</text>
  </g>

  <path d="M1577 485 V565" stroke="#53666d" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="1593" y="532" class="arrow-label">API 응답</text>
  <g transform="translate(1180 590)">
    <rect width="555" height="183" fill="#fff" stroke="#b8c7c9" stroke-width="2"/>
    <rect width="555" height="37" fill="#d99238"/>
    <text x="16" y="25" class="tool">브라우저 · HTML · CSS · JavaScript</text>
    <text x="20" y="85" class="node-title">웹 대시보드</text>
    <text x="20" y="117" class="node-body">위험도 · 공정 시계열 · 산점도 · A/B/C 스펙 관리</text>
    <text x="20" y="145" class="node-body">A: AI 상·하한  /  B: 평균±5σ  /  C: 분포 관찰</text>
    <text x="20" y="171" class="node-body">경보 확인 · 현장 조치 기록</text>
  </g>
  <path d="M1160 682 H1050" stroke="#53666d" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(710 590)">
    <rect width="320" height="183" fill="#fff" stroke="#b8c7c9" stroke-width="2"/>
    <rect width="320" height="37" fill="#39795d"/>
    <text x="16" y="25" class="tool">현장 운영</text>
    <text x="20" y="85" class="node-title">관리자 · 품질 담당자</text>
    <text x="20" y="117" class="node-body">위험 원인 확인</text>
    <text x="20" y="145" class="node-body">설비 · 센서 · SOP 점검</text>
    <text x="20" y="171" class="node-body">조치 결과 기록</text>
  </g>

  <text x="95" y="855" class="section">다음 확장 · 아직 미구현</text>
  <line x1="95" y1="872" x2="1825" y2="872" stroke="#d9c18e" stroke-width="2" stroke-dasharray="8 8"/>
  <path d="M870 773 V915" stroke="#d58a2d" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#future-arrow)"/>
  <g transform="translate(540 935)">
    <rect width="310" height="110" fill="#fffaf0" stroke="#d58a2d" stroke-width="2" stroke-dasharray="7 6"/>
    <text x="18" y="38" class="node-title">현장 챗봇</text>
    <text x="18" y="67" class="node-body">LLM + FastAPI 도구 호출</text>
    <text x="18" y="91" class="node-body">원인 · 조치 · 이력 질의</text>
  </g>
  <path d="M870 990 H990" stroke="#d58a2d" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#future-arrow)"/>
  <g transform="translate(1010 935)">
    <rect width="310" height="110" fill="#fffaf0" stroke="#d58a2d" stroke-width="2" stroke-dasharray="7 6"/>
    <text x="18" y="38" class="node-title">경보 규칙</text>
    <text x="18" y="67" class="node-body">고위험 · A/B 이탈</text>
    <text x="18" y="91" class="node-body">조치 미확인 상태</text>
  </g>
  <path d="M1340 990 H1460" stroke="#d58a2d" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#future-arrow)"/>
  <g transform="translate(1480 935)">
    <rect width="310" height="110" fill="#fffaf0" stroke="#d58a2d" stroke-width="2" stroke-dasharray="7 6"/>
    <text x="18" y="38" class="node-title">외부 알림</text>
    <text x="18" y="67" class="node-body">Notion API · 이메일 SMTP</text>
    <text x="18" y="91" class="node-body">담당자 통지 · 조치 요청</text>
  </g>
  <rect x="95" y="970" width="18" height="18" fill="#fff" stroke="#b8c7c9" stroke-width="2"/><text x="125" y="985" class="legend">현재 구현</text>
  <rect x="95" y="1005" width="18" height="18" fill="#fffaf0" stroke="#d58a2d" stroke-width="2" stroke-dasharray="5 4"/><text x="125" y="1020" class="legend">향후 확장</text>
</svg>
